plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.sahil.krishi.krishi"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.sahil.krishi.krishi"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23 // Android Keystore AES-GCM for private offline reports
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions "audience"
    productFlavors {
        farmer {
            dimension "audience"
            applicationId "com.sahil.krishi.krishi"
            resValue "string", "app_name", "Krishi Farmer"
            manifestPlaceholders.appIcon = "@drawable/ic_farmer"
        }
        team {
            dimension "audience"
            applicationId "com.sahil.krishi.team"
            resValue "string", "app_name", "Krishi Team"
            manifestPlaceholders.appIcon = "@drawable/ic_team"
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
